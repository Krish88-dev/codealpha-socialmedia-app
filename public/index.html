<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Socially | Modern Connect</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
</head>
<body>
    <div id="auth-view" class="auth-container">
        <div class="glass-panel auth-card">
            <h2 id="auth-title">Welcome Back</h2>
            <form id="auth-form" onsubmit="app.handleAuth(event)">
                <div class="input-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" required autocomplete="off">
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required>
                </div>
                <div class="input-group hidden" id="bio-group">
                    <label for="bio">Bio (Optional)</label>
                    <textarea id="bio" rows="2"></textarea>
                </div>
                <button type="submit" class="btn btn-primary" id="auth-submit">Login</button>
            </form>
            <div class="auth-switch">
                <span id="auth-switch-text" onclick="app.toggleAuthMode()">Don't have an account? Sign up</span>
            </div>
        </div>
    </div>

    <div id="main-app" class="hidden">
        <nav class="sidebar glass-panel">
            <div class="nav-brand" onclick="app.showFeed()">Socially</div>
            <div class="nav-links-vertical">
                <button class="nav-item active" id="nav-home" onclick="app.showFeed()">
                    <span class="icon">🏠</span> Home
                </button>
                <button class="nav-item" id="nav-profile" onclick="app.showMyProfile()">
                    <span class="icon">👤</span> Profile
                </button>
                <button class="nav-item" id="nav-notifications" onclick="app.showNotifications()">
                    <span class="icon">🔔</span> Notifications
                    <span class="badge hidden" id="notification-badge">0</span>
                </button>
                <button class="nav-item" id="nav-logout" onclick="app.logout()">
                    <span class="icon">🚪</span> Logout
                </button>
            </div>
            <div class="sidebar-user" id="sidebar-user">
                <!-- User profile snippet injected here -->
            </div>
        </nav>

        <main class="content-area">
            <!-- Feed View -->
            <div id="feed-view">
                <div class="page-header">
                    <h2>Home</h2>
                </div>
                <div class="glass-panel create-post">
                    <div class="create-post-inner">
                        <div class="avatar" id="feed-avatar">U</div>
                        <div class="post-input-wrapper" style="flex:1;">
                            <textarea id="new-post-content" placeholder="What's happening?"></textarea>
                            <div id="media-preview-container" class="media-preview hidden">
                                <button class="btn-close" onclick="app.clearMediaPreview()">×</button>
                            </div>
                        </div>
                    </div>
                    <div class="create-post-actions">
                        <label for="media-upload" class="media-upload-btn" title="Add Image or Video">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                        </label>
                        <input type="file" id="media-upload" accept="image/*,video/*" class="hidden" onchange="app.handleMediaSelect(event)">
                        <button class="btn btn-primary" onclick="app.createPost()">Post</button>
                    </div>
                </div>

                <div id="posts-container">
                    <!-- Skeletons or Posts will be injected here -->
                </div>
            </div>

            <!-- Profile View -->
            <div id="profile-view" class="hidden">
                <div class="page-header">
                    <h2>Profile</h2>
                </div>
                <div class="glass-panel profile-header">
                    <div class="profile-avatar" id="profile-avatar">U</div>
                    <h2 class="profile-name" id="profile-name">Username</h2>
                    <p class="profile-bio" id="profile-bio">This is a bio.</p>
                    <div class="profile-stats">
                        <div class="stat">
                            <span class="stat-value" id="stat-posts">0</span>
                            <span class="stat-label">Posts</span>
                        </div>
                        <div class="stat">
                            <span class="stat-value" id="stat-followers">0</span>
                            <span class="stat-label">Followers</span>
                        </div>
                        <div class="stat">
                            <span class="stat-value" id="stat-following">0</span>
                            <span class="stat-label">Following</span>
                        </div>
                    </div>
                    <button class="btn btn-primary" id="profile-follow-btn" onclick="app.toggleFollow()">Follow</button>
                </div>
                <h3 class="section-title">Posts</h3>
                <div id="profile-posts-container">
                    <!-- User's posts injected here -->
                </div>
            </div>

            <!-- Notifications View -->
            <div id="notifications-view" class="hidden">
                <div class="page-header">
                    <h2>Notifications</h2>
                    <button class="btn btn-sm" onclick="app.markNotificationsRead()">Mark all as read</button>
                </div>
                <div id="notifications-container">
                    <!-- Notifications injected here -->
                </div>
            </div>
        </main>

        <aside class="right-sidebar">
            <div class="glass-panel trending">
                <h3>Trending Topics</h3>
                <div class="trend-item">
                    <span>1 · Technology</span>
                    <strong>#WebDevelopment</strong>
                </div>
                <div class="trend-item">
                    <span>2 · Design</span>
                    <strong>#UIUX</strong>
                </div>
            </div>
        </aside>
    </div>

    <div id="toast-container"></div>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
